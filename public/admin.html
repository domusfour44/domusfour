<!doctype html>
<html lang="it">

<head>
  <meta name="referrer" content="no-referrer">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Gestione prodotti · Domus Neapolis</title>
    <link href="vendor/fonts/fonts.css" rel="stylesheet">
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>

<body>
    <header class="admin-header"><a href="index.html" class="wordmark">DOMUS<small>NEAPOLIS</small></a><a
            href="napoli.html#prodotti">Visita il catalogo</a></header>
    <main class="admin-main">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1>I tuoi prodotti</h1>
                <p>Prodotti, prezzi e dettagli. Tutto da un unico posto.</p>
            </div><button id="logout" class="btn btn-outline-primary" hidden>Esci</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <section id="access" class="admin-access">
            <h2 class="h4">Accesso amministratore</h2>
            <form id="login"><label class="form-label d-block">Email<input class="form-control" name="email"
                        type="email" required autocomplete="username"></label><label
                    class="form-label d-block">Password<input class="form-control" name="password" type="password"
                        required autocomplete="current-password"></label><button class="btn btn-primary">Accedi</button>
            </form>
        </section>
        <section id="workspace" hidden>
            <section class="mb-5" aria-labelledby="categories-title">
                <h2 id="categories-title" class="h4">Categorie</h2>
                <p class="small mb-3" id="category-list">Caricamento categorie…</p>
                <form id="category-form" class="d-flex flex-wrap align-items-end gap-2">
                    <label class="form-label mb-0">Nome della nuova categoria
                        <input class="form-control" name="name" required minlength="2" maxlength="80"
                            placeholder="es. San Valentino" autocomplete="off">
                    </label>
                    <button class="btn btn-outline-primary" type="submit">Crea categoria</button>
                </form>
                <p id="category-status" class="small mt-2" role="status" aria-live="polite"></p>
            </section>
            <div class="admin-layout">
                <section>
                    <div class="d-flex justify-content-between gap-2 mb-3"><label class="flex-grow-1">Cerca un
                            prodotto<input id="search" class="form-control" type="search"
                                placeholder="Nome o codice"></label><button class="btn btn-primary align-self-end"
                            id="new">Nuovo prodotto</button></div>
                    <p id="count" class="small"></p>
                    <div id="products"></div>
                </section>
                <section class="admin-editor" aria-labelledby="editor-title">
                    <h2 id="editor-title" class="h4">Nuovo prodotto</h2>
                    <form id="editor"><label class="form-label d-block">Codice univoco<input class="form-control"
                                name="id" type="text" required pattern="[a-z0-9][a-z0-9-]{0,79}"
                                placeholder="es. san-gennaro-oro"></label><label class="form-label d-block">Nome<input
                                class="form-control" name="name" type="text" required maxlength="160"></label><label
                            class="form-label d-block">Categoria<select class="form-select" name="category" required>
                                <option value="">Caricamento categorie…</option>
                            </select></label><label class="form-label d-block">Prezzo (€)<input class="form-control"
                                name="price" type="number" required min="0" max="100000" step="0.01"></label><label
                            class="form-label d-block">Immagine (URL HTTPS o assets/img/nome-file)<input
                                class="form-control" name="image" type="text" required></label><label
                            class="form-label d-block">Descrizione<textarea class="form-control" name="description"
                                maxlength="3000" rows="3"></textarea></label><label
                            class="form-label d-block">Dimensioni e materiali<input class="form-control" name="details"
                                type="text"></label><label class="form-label d-block">Etichetta (facoltativa)<input
                                class="form-control" name="badge" type="text"></label><label
                            class="form-label d-block">Link acquisto esterno (facoltativo)<input class="form-control"
                                name="purchase_url" type="url" placeholder="https://…"></label><label
                            class="d-block mb-2"><input type="checkbox" name="active" checked> Pubblicato nel
                            catalogo</label><label class="d-block mb-3"><input type="checkbox" name="featured"> In
                            evidenza nella home</label><button class="btn btn-primary" type="submit">Salva
                            prodotto</button> <button class="btn btn-outline-secondary" id="cancel"
                            type="button">Annulla</button></form>
                </section>
            </div>
        </section>
    </main>
    <script src="js/admin.js"></script>
</body>

</html>
